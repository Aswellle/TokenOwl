name: Dependency Audit

# Weekly advisory sweep for both dependency trees. Runs on a schedule and on
# demand; a published advisory with severity >= high fails the run so it is
# seen before the next release rather than after.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust advisory check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Installed from source instead of pulling in a third-party action;
      # the pinned set of actions stays exactly the ones already vetted.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  frontend-advisories:
    name: Frontend advisory check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Production dependencies only, high severity and above: dev-tooling
      # advisories that never ship in the bundle stay informational.
      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: pnpm audit --prod --audit-level high
