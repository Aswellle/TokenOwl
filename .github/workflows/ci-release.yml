name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    name: Frontend and Rust checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Enable project package manager
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck
      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify release version mirrors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageVersion = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version;
          const cargo = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!cargoVersion || cargoVersion !== packageVersion) {
            process.exit(1);
          }
          NODE

  release:
    name: Release ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            args: ""
          - target: darwin-aarch64
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
          - target: darwin-x86_64
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require updater signing secrets
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }
      - name: Verify tag matches package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            console.error(`Release tag ${tag} must be v${version} and use MAJOR.MINOR.PATCH`);
            process.exit(1);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable project package manager
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'darwin-aarch64' && 'aarch64-apple-darwin' || matrix.target == 'darwin-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Build and publish signed Tauri artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          owner: Aswellle
          repo: TokenOwl
          tagName: v__VERSION__
          releaseName: TokenOwl v__VERSION__
          releaseBody: "Signed Windows and macOS installers. Updater metadata is generated from these release assets."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
