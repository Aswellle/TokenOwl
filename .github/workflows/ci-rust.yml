name: CI Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Toolchain the lint and format gates are pinned to, for the same reason
  # the MSRV check pins its own: stable moves under us. Its rustfmt and
  # pedantic clippy lints change between releases, so the same commit that
  # was green on one stable can be red on the next with no code change (that
  # is exactly how assert_is_empty first appeared). Bump this deliberately,
  # run `cargo fmt` and clippy with the new version in the same commit, and
  # keep the local notes in AGENTS.md in sync.
  LINT_TOOLCHAIN: "1.100.0"

jobs:
  msrv:
    name: Rust MSRV check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Keep in sync with rust-version in Cargo.toml. Stable-only jobs
          # would let a dependency raise the real floor silently: cargo
          # selects versions compatible with this toolchain, so an upgrade
          # that needs a newer compiler fails here instead of on a
          # contributor's or updater's machine.
          toolchain: "1.90"

      - name: Rust MSRV check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  fmt:
    name: Rust format check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Pinned (see LINT_TOOLCHAIN): stable's formatter reflows code
          # between releases, which would flip this gate without a change.
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Pinned (see LINT_TOOLCHAIN): pedantic lints are added on stable
          # releases, and `-D warnings` turns every new one into a red build
          # on unchanged code. Bump together with a clippy-clean run.
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: clippy

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
