name: CI Version

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: Verify version consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify release version mirrors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageVersion = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version;
          const cargo = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!cargoVersion || cargoVersion !== packageVersion) {
            process.exit(1);
          }
          NODE
