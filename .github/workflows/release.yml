name: Release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege by default; only the release job below escalates to
# `contents: write` for draft-release creation and artifact upload.
permissions:
  contents: read

jobs:
  release:
    name: Release ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            args: ""
          - target: darwin-aarch64
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
          - target: darwin-x86_64
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to the full commit SHA of the tagged
      # release named in the comment; every SHA was fetched from the upstream
      # repository, not copied from a movable tag alias.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Nothing after checkout talks to git; the release upload uses the
          # step-scoped GITHUB_TOKEN below, so the checkout credential is
          # dropped instead of lingering for the whole job.
          persist-credentials: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version;
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            console.error(`Release tag ${tag} must be v${version} and use MAJOR.MINOR.PATCH`);
            process.exit(1);
          }
          NODE

      # Signing secrets live at STEP level: this existence check and the
      # signing build below are the only places they are ever visible —
      # checkout, Node/pnpm/Rust setup never see them.
      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'darwin-aarch64' && 'aarch64-apple-darwin' || matrix.target == 'darwin-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Build and publish signed Tauri artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          owner: Aswellle
          repo: TokenOwl
          tagName: v__VERSION__
          releaseName: TokenOwl v__VERSION__
          releaseBody: "Signed Windows and macOS installers. Updater metadata is generated from these release assets."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
