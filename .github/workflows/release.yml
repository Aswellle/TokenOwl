name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            args: ""
          - target: darwin-aarch64
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
          - target: darwin-x86_64
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version;
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            console.error(`Release tag ${tag} must be v${version} and use MAJOR.MINOR.PATCH`);
            process.exit(1);
          }
          NODE

      - name: Require updater signing secrets
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'darwin-aarch64' && 'aarch64-apple-darwin' || matrix.target == 'darwin-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Build and publish signed Tauri artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          owner: Aswellle
          repo: TokenOwl
          tagName: v__VERSION__
          releaseName: TokenOwl v__VERSION__
          releaseBody: "Signed Windows and macOS installers. Updater metadata is generated from these release assets."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          verifyDepsBeforeRun: false
