[package]
name = "tokenowl"
version = "1.3.0"
description = "A local-first AI usage and quota monitor"
authors = ["TokenOwl contributors"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tokenowl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documented deviations from pedantic: rejected project-wide because they do not
# improve this codebase.
missing_errors_doc = "allow"     # error variants are documented on the error enums
must_use_candidate = "allow"     # consumed through Tauri IPC, not as a public library
needless_pass_by_value = "allow" # command/DTO boundaries intentionally take owned values
return_self_not_must_use = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
reqwest = { version = "0.13", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
url = "2"
nanoid = "0.4"
async-trait = "0.1"
serde_yaml = "0.9"
chrono = "0.4"
tauri-plugin-global-shortcut = "2"
zeroize = "1.9.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
