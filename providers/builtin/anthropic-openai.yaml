id: anthropic-openai
version: 1
name: Anthropic (OpenAI 兼容)
category: official
region: global
auth:
  - api_key
baseUrl: https://api.anthropic.com/v1
apiKeyHeader: Authorization
endpoints:
  models: /v1/models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [token]
  targetWindows: [provider-defined]
  priority: P0
