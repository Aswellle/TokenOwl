id: baichuan
version: 1
name: Baichuan
category: official
region: china
auth:
  - api_key
baseUrl: https://api.baichuan-ai.com/v1
apiKeyHeader: Authorization
endpoints:

apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  # No endpoints are known for this provider, so the account
# is custom access (L1): there is no models endpoint to health-check against.
  level: L1
  accountTypes: [api]
  quotaUnits: [token, balance]
  targetWindows: [billing]
  priority: P1
