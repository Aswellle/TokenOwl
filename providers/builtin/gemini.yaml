id: gemini
version: 1
name: Google Gemini
category: official
region: global
auth:
  - api_key
baseUrl: https://generativelanguage.googleapis.com/v1beta
apiKeyHeader: x-goog-api-key
endpoints:
  models: /v1beta/models
network:
  timeoutMs: 15000
  followRedirects: false
apiFormat: google-ai
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [token]
  targetWindows: [provider-defined]
  priority: P0
