id: groq
version: 1
name: Groq
category: official
region: global
auth:
  - api_key
baseUrl: https://api.groq.com/openai/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [request, token, rate]
  targetWindows: [hourly, provider-defined]
  priority: P1
