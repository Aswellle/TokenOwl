id: kimi
version: 1
name: Kimi / Moonshot
brand: kimi
variant: 国内版
category: official
region: china
auth:
  - api_key
baseUrl: https://api.moonshot.cn/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
  usage: /users/me/balance
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L3
  accountTypes: [subscription, api]
  quotaUnits: [token, balance]
  targetWindows: [5h, 7d, balance]
  priority: P0
