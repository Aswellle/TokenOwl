id: kimi
version: 1
name: Kimi / Moonshot
brand: kimi
variant: 国内版
category: official
region: china
auth:
  - api_key
baseUrl: https://api.moonshot.cn/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
  balance: /users/me/balance
mapping:
  balance:
    value: data.available_balance
    unit: currency
    currency: CNY
    role: remaining
  metrics:
    - name: 代金券余额
      value: data.voucher_balance
      unit: currency
      currency: CNY
      role: remaining
    - name: 现金余额
      value: data.cash_balance
      unit: currency
      currency: CNY
      role: remaining
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L3
  accountTypes: [subscription, api]
  quotaUnits: [token, balance]
  targetWindows: [5h, 7d, balance]
  priority: P0
