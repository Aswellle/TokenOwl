id: mistral
version: 1
name: Mistral
category: official
region: global
auth:
  - api_key
baseUrl: https://api.mistral.ai/v1
apiKeyHeader: Authorization
endpoints:
  models: /v1/models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api, subscription]
  quotaUnits: [credit, currency]
  targetWindows: [monthly, balance]
  priority: P1
