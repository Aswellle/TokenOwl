id: openai
version: 1
name: OpenAI
category: official
region: global
auth:
  - api_key
baseUrl: https://api.openai.com/v1
apiKeyHeader: Authorization
endpoints:
  models: /v1/models
network:
  timeoutMs: 10000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [token]
  targetWindows: [provider-defined]
  priority: P0
