id: openrouter
version: 1
name: OpenRouter
category: aggregator
region: global
auth:
  - api_key
baseUrl: https://openrouter.ai/api/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
  usage: /api/v1/key
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L4
  accountTypes: [prepaid, api]
  quotaUnits: [currency, token]
  targetWindows: [balance, usage]
  priority: P0
