id: qwen
version: 1
name: Qwen / Alibaba
category: official
region: china
auth:
  - api_key
baseUrl: https://dashscope.aliyuncs.com/api/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
  usage: /usage
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L3
  accountTypes: [coding, token, api]
  quotaUnits: [token, credit]
  targetWindows: [5h, 7d, balance]
  priority: P0
