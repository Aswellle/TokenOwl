id: siliconflow
version: 1
name: SiliconFlow
category: official
region: china
auth:
  - api_key
baseUrl: https://api.siliconflow.cn/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
  balance: /user/info
mapping:
  balance:
    value: data.totalBalance
    unit: currency
    currency: CNY
    role: remaining
  metrics:
    - name: 充值余额
      value: data.chargeBalance
      unit: currency
      currency: CNY
      role: remaining
    - name: 赠送余额
      value: data.balance
      unit: currency
      currency: CNY
      role: remaining
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L3
  accountTypes: [api]
  quotaUnits: [currency, token]
  targetWindows: [balance, usage]
  priority: P1
