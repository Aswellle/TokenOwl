id: stepfun
version: 1
name: StepFun
category: official
region: china
auth:
  - api_key
baseUrl: https://api.stepfun.com/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api, subscription]
  quotaUnits: [credit, token]
  targetWindows: [provider-defined]
  priority: P1
