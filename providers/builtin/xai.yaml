id: xai
version: 1
name: xAI
category: official
region: global
auth:
  - api_key
baseUrl: https://api.x.ai/v1
apiKeyHeader: Authorization
endpoints:
  models: /v1/models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [currency, token]
  targetWindows: [billing]
  priority: P1
