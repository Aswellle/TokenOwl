id: xiaomi-mimo
version: 1
name: Xiaomi MiMo
category: official
region: china
auth:
  - api_key
baseUrl: https://api.xiaomimimo.com/v1
apiKeyHeader: Authorization
endpoints:
  models: /models
apiFormat: openai-compatible
network:
  timeoutMs: 15000
  followRedirects: false
capability:
  level: L2
  accountTypes: [api]
  quotaUnits: [usage, credit]
  targetWindows: [provider-defined]
  priority: P2
